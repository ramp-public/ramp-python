[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27,<2"]

[dependency-groups]
test = [
  "pytest>=9.0.3,<10",
  "ruff>=0.15.6,<1",
]

[project]
authors = [
  {name = "Ramp", email = "developer@ramp.com"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]
description = "Official Python SDK for Ramp"
keywords = ["ramp", "sdk", "developer-api"]
license = "MIT"
license-files = ["LICENSE"]
name = "ramp-python"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.urls]
Documentation = "https://docs.ramp.com/"
Issues = "https://github.com/ramp-public/ramp-python/issues"
Repository = "https://github.com/ramp-public/ramp-python"

[tool.hatch.build.targets.sdist]
only-include = ["src/ramp"]

[tool.hatch.build.targets.wheel]
packages = ["src/ramp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
